# ACT-POLYC2-DAFNY-PROOF-MVP01
#
# Dafny project configuration for the PolyC identifier
# scanner MVP proof.
#
# Pinned: Dafny 4.11.0 (see evidence/ACT-POLYC2-DAFNY-PROOF-MVP01/toolchain.txt).
#
# This file is consumed by `dafny verify` when run inside
# the formal/dafny/ directory. The CLI flags that need to
# be set on the command line (because they are not valid
# keys for [options] in dfyconfig.toml under 4.11.0) live
# in scripts/quality/formal-dafny.sh, the repository's
# stable entry point.

[options]
# Warn on redundant assumptions (any requires clause or
# assume statement that is not needed to complete
# verification). See:
#   dafny verify --help-internal | grep warn-redundant-assumptions
warn-redundant-assumptions = true

# Warn on contradictory assumptions (any assertion that is
# proved only because the assumptions are inconsistent).
# See:
#   dafny verify --help-internal | grep warn-contradictory-assumptions
warn-contradictory-assumptions = true
